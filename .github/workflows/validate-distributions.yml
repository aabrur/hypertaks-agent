name: Validate distributions

on:
  push:
    branches: [main, feat/cross-ai-distribution-wave-2]
  pull_request:

jobs:
  validate-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate distribution registry
        run: python scripts/validate_distributions.py

      - name: Build-check Antigravity package
        run: python scripts/build_distributions.py antigravity --check-only

      - name: Validate cross-host conformance
        run: python scripts/validate_conformance.py

      - name: Run distribution, installer, and conformance unit tests
        run: python -m unittest scripts.test_build_distributions scripts.test_installer scripts.test_validate_conformance -v
